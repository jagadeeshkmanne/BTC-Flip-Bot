# BTC-Flip-Bot dashboard — nginx site config
# Place at /etc/nginx/sites-available/btc-bot
# Enable: ln -s /etc/nginx/sites-available/btc-bot /etc/nginx/sites-enabled/
# Disable default: rm /etc/nginx/sites-enabled/default
# Reload: sudo nginx -t && sudo systemctl reload nginx

# Upstream = Python server, bound to 127.0.0.1:8889 (internal only)
upstream btc_bot_app {
    server 127.0.0.1:8889;
    keepalive 16;
}

# In-memory cache for Bybit-proxy responses (lightweight, no disk)
proxy_cache_path /var/cache/nginx/btc-bot levels=1:2 keys_zone=btc_api:10m
                 max_size=50m inactive=10m use_temp_path=off;

server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name _;

    # Static dashboard assets served directly by nginx — instant.
    # Use `root` (not `alias`) so try_files SPA-fallback works correctly.
    # URL /bots/v1 → root + path → /home/jags/BTC-Flip-Bot/static/bots/v1
    # Falls through to /home/jags/BTC-Flip-Bot/static/bots/index.html
    root /home/jags/BTC-Flip-Bot/static;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_static on;          # serve pre-built .gz if it exists (vite-plugin-compression)

    client_max_body_size 1m;
    keepalive_timeout 30s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Hashed assets — immutable cache, browser never re-asks
    location ~* ^/bots/assets/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA routes — anything under /bots/ that isn't a static file → index.html
    location /bots/ {
        try_files $uri $uri/ /bots/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ─── / and /dashboard.html → redirect to /bots/v1 ───
    location = / {
        return 302 /bots/v1;
    }
    location = /dashboard.html {
        return 302 /bots/v1;
    }
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    # ─── API + everything else → Python app on :8889 ───
    location / {
        proxy_pass http://btc_bot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Bybit-proxy cache (short TTL — supplements the Python in-memory cache)
    location = /api/ticker {
        proxy_pass http://btc_bot_app;
        proxy_cache btc_api;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;          # collapse concurrent requests
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
    }
    location = /api/klines {
        proxy_pass http://btc_bot_app;
        proxy_cache btc_api;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
    }
}
